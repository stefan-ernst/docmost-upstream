name: Fork build (custom image)

# Builds a Docker image from this fork into ghcr.io/<owner>/forkmost.
# Decoupled from upstream image.yml so the PR diff stays clean.
# Triggers:
#   - push to fork-build branch (auto)
#   - manual workflow_dispatch with a ref input (any branch)

on:
  push:
    branches: [fork-build]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch or commit SHA)
        required: true
        default: mcp-content-uploads
      tag:
        description: Image tag suffix (appended after fork-)
        required: true
        default: mcp-uploads

concurrency:
  group: fork-build-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Refuse to build with EE folders present
        run: |
          if [ -d "apps/server/src/ee" ] || [ -d "apps/client/src/ee" ] || [ -d "packages/ee" ]; then
            echo "EE folders detected — refusing to build under AGPL"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          TAG_SUFFIX="${{ github.event.inputs.tag || 'mcp-uploads' }}"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/forkmost"
          {
            echo "image=$IMAGE"
            echo "tags=$IMAGE:fork-$TAG_SUFFIX,$IMAGE:fork-$TAG_SUFFIX-$SHORT_SHA"
            echo "short_sha=$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Forkmost (stefan-ernst fork)
            org.opencontainers.image.description=Custom build with MCP content-upload endpoint
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.tags.outputs.short_sha }}

      - name: Summary
        run: |
          echo "### Image tags" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
